<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#012143">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control Vehicular | Policía Estatal Coahuila</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
  /* CSS crítico: lo mínimo para pintar algo útil antes de cargar app.css */
  html,body{margin:0;height:100%;background:#f2f4f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:#15202e}
  .splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#012143;color:#fff}
  .splash img{width:104px;height:104px}
  .splash-t{font-size:1.05rem;font-weight:600;letter-spacing:.01em}
  .splash-b{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
  .splash-b::after{content:"";display:block;width:40%;height:100%;background:#fda800;animation:sp 1.1s ease-in-out infinite}
  @keyframes sp{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){.splash-b::after{animation:none;width:100%}}
</style>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <div class="splash" role="status" aria-label="Cargando">
    <img src="assets/img/logo-policia-blanco-96.webp" width="104" height="104" alt="">
    <div class="splash-t">Control Vehicular</div>
    <div class="splash-b"></div>
  </div>
</div>
<noscript><p style="padding:24px">Esta aplicación necesita JavaScript activado.</p></noscript>
</body>
</html>
